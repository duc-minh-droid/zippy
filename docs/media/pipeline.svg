<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f3f5f8; stroke: #9aa4b2; stroke-width: 1.4; }
    .hot { fill: #fff4dc; stroke: #c27c00; stroke-width: 1.6; }
    .cool { fill: #e3f4f4; stroke: #0f8f94; stroke-width: 1.6; }
    .t { fill: #1b1f24; font-size: 13px; font-weight: 600; }
    .s { fill: #5d6673; font-size: 11px; }
    .m { font-family: ui-monospace, Consolas, monospace; }
    .h { fill: #5d6673; font-size: 11px; letter-spacing: .12em; font-weight: 600; }
    .a { stroke: #5d6673; stroke-width: 1.5; fill: none; marker-end: url(#arr); }
    .d { stroke: #c27c00; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrh); }
    .ah { fill: #5d6673; } .ahh { fill: #c27c00; }
    .amber { fill: #c27c00; } .teal { fill: #0f8f94; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0e1116; }
      .box { fill: #161b22; stroke: #3d4756; }
      .hot { fill: #2a2211; stroke: #f2b33d; }
      .cool { fill: #102426; stroke: #4fc3c7; }
      .t { fill: #e6e9ee; } .s, .h { fill: #8b95a3; }
      .a { stroke: #8b95a3; } .ah { fill: #8b95a3; }
      .d { stroke: #f2b33d; } .ahh { fill: #f2b33d; }
      .amber { fill: #f2b33d; } .teal { fill: #4fc3c7; }
    }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
    <marker id="arrh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahh"/></marker>
  </defs>
  <rect class="bg" width="960" height="470" rx="12"/>

  <!-- compress row -->
  <text class="h" x="24" y="32">ZIPPY COMPRESS</text>
  <g>
    <rect class="box" x="20" y="46" width="112" height="70" rx="8"/>
    <text class="t" x="76" y="74" text-anchor="middle">input</text>
    <text class="s" x="76" y="92" text-anchor="middle">any file, read</text>
    <text class="s" x="76" y="106" text-anchor="middle">as raw bytes</text>

    <rect class="box" x="152" y="46" width="124" height="70" rx="8"/>
    <text class="t" x="214" y="74" text-anchor="middle">count</text>
    <text class="s" x="214" y="92" text-anchor="middle">rayon, 64 KiB chunks</text>
    <text class="s m" x="214" y="106" text-anchor="middle">[u64; 256]</text>

    <rect class="hot" x="296" y="46" width="124" height="70" rx="8"/>
    <text class="t" x="358" y="74" text-anchor="middle">min-heap</text>
    <text class="s" x="358" y="92" text-anchor="middle">key = (count, id)</text>
    <text class="s" x="358" y="106" text-anchor="middle">pop 2, push sum</text>

    <rect class="hot" x="440" y="46" width="124" height="70" rx="8"/>
    <text class="t" x="502" y="74" text-anchor="middle">tree</text>
    <text class="s" x="502" y="92" text-anchor="middle">leaf id = byte value</text>
    <text class="s" x="502" y="106" text-anchor="middle">inner id = 256 + step</text>

    <rect class="box" x="584" y="46" width="112" height="70" rx="8"/>
    <text class="t" x="640" y="74" text-anchor="middle">code table</text>
    <text class="s" x="640" y="92" text-anchor="middle">left = <tspan class="teal m">0</tspan>, right = <tspan class="amber m">1</tspan></text>
    <text class="s" x="640" y="106" text-anchor="middle">u128 + length</text>

    <rect class="box" x="716" y="46" width="104" height="70" rx="8"/>
    <text class="t" x="768" y="74" text-anchor="middle">bit packer</text>
    <text class="s" x="768" y="92" text-anchor="middle">MSB first, last</text>
    <text class="s" x="768" y="106" text-anchor="middle">byte zero-padded</text>

    <rect class="cool" x="840" y="46" width="100" height="70" rx="8"/>
    <text class="t m" x="890" y="78" text-anchor="middle">file.zpy</text>
    <text class="s" x="890" y="98" text-anchor="middle">+ in-memory</text>
    <text class="s" x="890" y="110" text-anchor="middle">round-trip check</text>

    <path class="a" d="M132,81 H150"/><path class="a" d="M276,81 H294"/><path class="a" d="M420,81 H438"/>
    <path class="a" d="M564,81 H582"/><path class="a" d="M696,81 H714"/><path class="a" d="M820,81 H838"/>
  </g>

  <!-- file layout -->
  <text class="h" x="24" y="162">.ZPY LAYOUT (abracadabra, 18 bytes)</text>
  <text class="s" x="330" y="162">no tree, bit count or length is stored: length = sum of counts</text>
  <g class="m" font-size="12">
    <rect class="box" x="20" y="174" width="190" height="46" rx="6"/>
    <text class="t m" x="115" y="194" text-anchor="middle" font-size="12">5A 50 59 01</text>
    <text class="s" x="115" y="211" text-anchor="middle">magic "ZPY" + version</text>

    <rect class="box" x="214" y="174" width="80" height="46" rx="6"/>
    <text class="t m" x="254" y="194" text-anchor="middle" font-size="12">04</text>
    <text class="s" x="254" y="211" text-anchor="middle">n - 1</text>

    <rect class="hot" x="298" y="174" width="370" height="46" rx="6"/>
    <text class="t m" x="483" y="194" text-anchor="middle" font-size="12">61 05  62 02  63 01  64 01  72 02</text>
    <text class="s" x="483" y="211" text-anchor="middle">n x (symbol byte, count as LEB128 varint)</text>

    <rect class="cool" x="672" y="174" width="268" height="46" rx="6"/>
    <text class="t m" x="806" y="194" text-anchor="middle" font-size="12">6E 8A DC</text>
    <text class="s" x="806" y="211" text-anchor="middle">payload: 23 bits + 1 pad bit</text>
  </g>

  <!-- decompress row -->
  <text class="h" x="24" y="286">ZIPPY DECOMPRESS</text>
  <g>
    <rect class="cool" x="20" y="300" width="112" height="64" rx="8"/>
    <text class="t m" x="76" y="336" text-anchor="middle">file.zpy</text>

    <rect class="box" x="152" y="300" width="160" height="64" rx="8"/>
    <text class="t" x="232" y="326" text-anchor="middle">read header</text>
    <text class="s" x="232" y="344" text-anchor="middle">counts, total = sum</text>

    <rect class="hot" x="332" y="300" width="232" height="64" rx="8"/>
    <text class="t" x="448" y="326" text-anchor="middle">same heap, same tree</text>
    <text class="s" x="448" y="344" text-anchor="middle">ids are unique, so no ties to break</text>

    <rect class="box" x="584" y="300" width="236" height="64" rx="8"/>
    <text class="t" x="702" y="326" text-anchor="middle">walk the tree bit by bit</text>
    <text class="s" x="702" y="344" text-anchor="middle">emit at each leaf, stop after total</text>

    <rect class="box" x="840" y="300" width="100" height="64" rx="8"/>
    <text class="t" x="890" y="336" text-anchor="middle">bytes</text>

    <path class="a" d="M132,332 H150"/><path class="a" d="M312,332 H330"/><path class="a" d="M564,332 H582"/><path class="a" d="M820,332 H838"/>
  </g>
  <path class="d" d="M448,220 V298"/>
  <text class="s" x="456" y="264" font-style="italic">counts rebuild the identical tree</text>

  <!-- trace -->
  <text class="h" x="24" y="404">--TRACE</text>
  <rect class="box" x="20" y="414" width="920" height="40" rx="8"/>
  <text class="s" x="36" y="438"><tspan class="t m" font-size="12">zippy stats f --trace -</tspan>  frequencies, every heap merge, the code table and the real packed bits as JSON  →  <tspan class="t m" font-size="12">web/</tspan> animates it. <tspan class="t m" font-size="12">web/huffman.js</tspan> is checked against it.</text>
</svg>
